<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#33b33b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Katalog" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="prefetch" href="/data/products-lite.json" as="fetch" crossorigin="anonymous" />
    <link rel="prefetch" href="/data/shop-products-lite.json" as="fetch" crossorigin="anonymous" />
    <title>Katalog — Kenochem</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('katalog-theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      /* Bez białego flashu zanim wczyta się CSS / React */
      html, body { margin: 0; min-height: 100%; background: #f5f7fb; color: #0f172a; }
      html.dark, html.dark body { background: #020617; color: #e2e8f0; }
      #root { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
